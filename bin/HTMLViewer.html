<!doctype html><html><head><meta name="charset" content="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><style>@media (prefers-color-scheme: dark) {
	:root {
		--bg-color: black;
		--text-color: hsl(0, 0%, 75%);
		--focus-color: rgb(255, 174, 0);

		--border-color-interactivity: var(--text-color);
		--border-color: hsl(209, 100%, 50%);

		--bg-color-secondary: hsl(209, 100%, 15%);

		--link-color: hsl(200, 100%, 63%);
		--link-color-visited: hsl(297, 100%, 63%);

		--bg-color-secondary-gradient: linear-gradient(90deg, rgba(255,255,255, 0) 0%, var(--bg-color-secondary) 20%, var(--bg-color-secondary) 80%, rgba(255, 255, 255, 0) 100%);
	}

	html {
		scrollbar-color: var(--focus-color) var(--bg-color-secondary);
	}
}

@media (prefers-color-scheme: light) {
	:root {
		--bg-color: rgb(243, 242, 241);
		--text-color: black;
		--focus-color: rgb(255, 85, 0);

		/* --border-color-interactivity: black; */
		--border-color-interactivity: hsl(0, 1%, 25%);
		--border-color: hsl(209, 100%, 29%);

		--bg-color-secondary: hsl(199.8, 100%, 67.8%);

		--link-color: hsl(239, 100%, 50%);
		--link-color-visited: hsl(279, 100%, 50%);

		--bg-color-secondary-gradient: linear-gradient(90deg, rgb(255,255,255) 0%, var(--bg-color-secondary) 20%, var(--bg-color-secondary) 80%, rgb(255, 255, 255) 100%)
	}

	html {
		scrollbar-color: var(--focus-color) var(--border-color-interactivity);
	}
}

html, body {
	height: 100%; /* Important so height of slides get computed correctly so each slide displays fullscreen */
	width: 100%;
	margin: 0;

	background-color: var(--bg-color);
	color: var(--text-color);
}

html {
	overflow: scroll;
	scrollbar-width: auto;
}

p {
	line-height: 2.25em;
}

p:first-child {
	margin-top: 0;
}

p:last-child {
	margin-bottom: 0;
}

li {
	line-height: 2em;
}

a {
	color: var(--link-color);
}

a:visited {
	color: var(--link-color-visited);
}

*:focus {
	outline: 0.2em dashed var(--focus-color);
	outline-offset: 0.25em;
}

/* Ruleset: Make it appear visually that the label has focus and not the input child inside */
/* Rule: Show focus on label visually */
label:focus-within {
	outline: 0.2em dashed var(--focus-color);
	outline-offset: 0.25em;
}

/* Rule: Hide focus on focusable element if it is a child of a label element */
label:focus-within > *:focus {
	outline: none;
	outline-offset: none;
}

*[hidden] {
	display: none !important;
}

*[data-i18n="app_slogan"] {
	font-weight: 800;
	letter-spacing: 0.06em;
	word-spacing: 0.25em;
	text-align: center;
	color: var(--border-color);
}

form {
	height: 100%;
	box-sizing: border-box;
}

form label {
	display: block;
	cursor: pointer;
	padding: 0.2em;
}

form > div {
	padding: 1em 0;
	width: 100%;
}

form input[type=file], form input[type=button] {
	border: 0.2em solid var(--border-color-interactivity);
	padding: 1em;
	border-radius: 0.5em;
	cursor: pointer;
	background: var(--bg-color-secondary-gradient);
	color: var(--text-color);
	transition: box-shadow 0.2s ease;
	font-weight: bold;
	min-width: 100%;
	box-sizing: border-box;
}

input[type="file"]::file-selector-button {
	display: none;
}

form input[type=file]:hover, form input[type=file]:focus, form input[type=button]:hover, form input[type=button]:focus {
	box-shadow: 0em 0.1em 1em 0.05em var(--border-color-interactivity);
}

form input[type=radio] {
	appearance: none;
	box-sizing: border-box;

	border: 0.1em solid var(--border-color-interactivity);
	
	border-radius: 50%;
	width: 1em;
	height: 1em;
	
	transition: 0.2s all linear;
}

form input[type=radio]:checked {
	border-color: var(--border-color);
	border-width: 0.35em;
	border-style: double;
	box-shadow: 0em 0.05em 0.5em 0.05em var(--border-color);
}

.options-container {
	display: flex;
	flex-wrap: wrap;
	align-items: stretch;
	align-content: stretch;
}

.options-container>* {
	flex: 1 0 40%;
}

.help-text {
	display: inline-flex;
	flex-direction: column;
	justify-content: space-between;

	border: 0.2em solid var(--border-color);
	border-radius: 0.5em;
	padding: 1em;
	box-sizing: border-box;
	margin: 1em 1em;

	color: var(--text-color);
}

.button-group {
	display: inline-flex;
	flex-direction: column;
	gap: 1em;
}

#setup {
	display: flex;
	justify-content: center;
	container-type: size;
	container-name: area;
	box-sizing: border-box;

	width: 100%;
	min-height: 100%;

	padding: 0.5em;
}

#setup > * {
	flex-basis: 40%;
}

#slideshow-container {
	width: 100%;
	height: 100%; /* Important so height of slides get computed correctly so each slide displays fullscreen */
	box-sizing: border-box;
}

#handout-container {
	container-type: size;
	container-name: area;
	box-sizing: border-box;
	
	padding: 0.5em 20%;
	
	width: 100%;
	/* min-height: 100%; */
}

@container area (max-width: 1600px) {
	#setup>* {
		flex-basis: 60%;
	}
}

@container area (max-width: 1400px) {
	#setup>*{
		flex-basis: 70%;
	}
}

@container area (max-width: 1200px) {
	#setup>* {
		flex-basis: 80%;
	}
}

@container area (max-width: 900px) {
	#setup > * {
		flex-basis: 100%;
	}
}

@media screen and (max-width: 1600px) {
	#handout-container {
		padding: 0.5em 20%;
	}
}

@media screen and (max-width: 1400px) {
	#handout-container {
		padding: 0.5em 15%;
	}
}

@media screen and (max-width: 1200px) {
	#handout-container {
		padding: 0.5em 10%;
	}
}

@media screen and (max-width: 900px) {
	#handout-container {
		padding: 0.5em 0.5em;
	}
}

@media (forced-colors: active) {
	:root {
		--text-color: CanvasText;
		--bg-color: Canvas;
		--bg-color-secondary: Canvas;
		--focus-color: AccentColor;
		--border-color: CanvasText;
		--border-color-interactivity: ButtonBorder;
	}

	input[type=button]:hover, button:hover, input[type=file]:hover, input[type=file]:focus {
		border-color: Highlight;
	}
